    <rect x="15" y="418" width="380" height="110" rx="12" fill="#cdeac0"/>
    <rect x="405" y="418" width="380" height="110" rx="12" fill="#b8d4e3"/>
    <rect x="15" y="588" width="150" height="50" rx="10" fill="#ffffff"/>
