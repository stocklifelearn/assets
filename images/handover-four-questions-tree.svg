  </defs>
  <rect width="800" height="720" fill="#ffffff"/>
  <text x="400" y="52" text-anchor="middle" font-size="30" class="cn" fill="#333333">交接四问</text>
  <text x="400" y="82" text-anchor="middle" font-size="18" class="en" fill="#888888">Handover Four Questions</text>

  <g filter="url(#rough)" stroke="#9aa0a6" stroke-width="1.5" stroke-linejoin="round">
    <rect x="270" y="108" width="260" height="56" rx="12" fill="#ffd6d6"/>
    <rect x="15" y="204" width="170" height="52" rx="12" fill="#ffd6d6"/>
