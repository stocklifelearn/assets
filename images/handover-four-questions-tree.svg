  <g stroke="#9aa0a6" stroke-width="1.5" fill="none">
    <line x1="400" y1="164" x2="400" y2="184"/>
    <line x1="100" y1="184" x2="700" y2="184"/>
    <line x1="100" y1="184" x2="100" y2="204"/>
